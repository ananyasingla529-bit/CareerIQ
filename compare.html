<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Compare 2-3 saved job analyses side by side to decide which opportunity is the best fit." />
  <meta name="theme-color" content="#0B0E2E" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <meta property="og:title" content="Compare Jobs — CareerIQ" />

  <link rel="stylesheet" href="css/styles.css" />
</head>

  <main>
    <section class="section">
      <div class="container">
        <h1>Compare Jobs</h1>
        <p class="text-muted">Side-by-side comparison of your selected analyses.</p>

        <div id="compareContainer"></div>

          <p class="text-muted">Go to your Dashboard, select 2 or 3 saved analyses using the checkboxes, then click "Compare Selected."</p>

        </div>
      </div>
    </section>
