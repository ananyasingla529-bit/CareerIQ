<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="View and manage all of your saved job fit analyses in one place with CareerIQ." />
  <meta name="theme-color" content="#0B0E2E" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <meta property="og:title" content="My Analyses — CareerIQ" />
  <meta property="og:type" content="website" />
  <title>My Analyses — CareerIQ</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <main>
    <section class="section">
      <div class="container">
        <div class="dashboard-header">
          <div>
            <h1 style="margin-bottom: 0;">My Analyses <span id="analysisCount" class="text-muted" style="font-size: 1.2rem; font-weight: 400;"></span></h1>
            <p class="text-muted" style="margin: 0;">All analyses are stored only on this device.</p>
          </div>
          <div class="dashboard-actions">
            <button type="button" id="exportAllBtn" class="btn btn-secondary">Export All</button>
            <button type="button" id="deleteAllBtn" class="btn btn-danger">Delete All</button>
          </div>
        </div>

        <div id="dashboardGrid" class="dashboard-grid"></div>

        <div id="emptyState" class="empty-state hidden">
          <div class="empty-state-icon">📋</div>
          <h3>No analyses yet</h3>
          <p class="text-muted">Analyze your first job to start building your history.</p>
          <a href="analyze.html" class="btn btn-primary mt-2">Analyze a Job &rarr;</a>
        </div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/report.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
